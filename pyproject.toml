[project]
name = "recurrent-streaming-rl"
version = "0.1.0"
description = "Recurrent Streaming Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memorax[popjym,brax]",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
memorax = { git = "https://github.com/noahfarr/memorax.git" }

[tool.setuptools.packages.find]
include = ["src*"]
