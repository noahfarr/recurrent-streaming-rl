[project]
name = "recurrent-streaming-rl"
version = "0.1.0"
description = "Recurrent Streaming Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlet",
    "popgymnax",
    "distrax>=0.1.5",
    "flashbax>=0.1.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[tool.uv]
override-dependencies = ["lox"]

[tool.uv.sources]
lox = { git = "https://github.com/huterguier/lox", branch = "dev" }
popgymnax = { git = "https://github.com/noahfarr/popgymnax.git" }
streamlet = { git = "ssh://git@github.com/noahfarr/streamlet.git" }

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
