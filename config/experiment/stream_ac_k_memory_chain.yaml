# @package _global_
defaults:
  - override /algorithm: stream_ac
  - override /environment: rsrl/k_memory_chain
  - override /cell: rtu
  - override /mode: rtrl
  - override /logger: [dashboard,wandb]

mode:
  track: true
  staleness_interval: 1

num_seeds: 5
num_episodes: 0
num_epochs: 50

hydra:
