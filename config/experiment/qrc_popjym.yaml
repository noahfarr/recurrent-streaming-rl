# @package _global_
defaults:
  - override /algorithm: qrc
  - override /mode: rtrl
  - override /logger: [dashboard,wandb]

seed: 0
num_seeds: 5

cell:
  config:
    features: 64
    activation_fn:
      _target_: src.utils.identity.identity
      _partial_: true
    output_activation_fn:
      _target_: jax.numpy.tanh
      _partial_: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      cell: rtu
      environment: popjym/easy/count_recall,popjym/easy/repeat_first,popjym/easy/concentration,popjym/easy/autoencode,popjym/easy/higher_lower
