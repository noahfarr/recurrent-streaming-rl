# @package _global_
defaults:
  - override /algorithm: qrc
  - override /environment: gymnax/bsuite/memory_chain
  - override /logger: [dashboard,wandb]

num_seeds: 5
num_epochs: 25
deterministic: True

cell:
  config:
    features: 128

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      cell: rtu
      mode: bptt,rtrl
      environment.env_params.max_steps_in_episode: 48
