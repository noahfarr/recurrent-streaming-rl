# @package _global_
defaults:
  - override /algorithm: qrc_lambda
  - override /mode: rtrl
  - override /logger: [dashboard,wandb]

seed: 0
num_seeds: 5

cell:
  config:
    features: 64
    activation_fn:
      _target_: src.utils.identity.identity
      _partial_: true
    output_activation_fn:
      _target_: jax.numpy.tanh
      _partial_: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      cell: rtu
      environment: popgymnax/easy/count_recall,popgymnax/easy/repeat_first,popgymnax/easy/concentration,popgymnax/easy/autoencode,popgymnax/easy/higher_lower
