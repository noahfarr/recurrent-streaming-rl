# @package _global_

algorithm:
  _target_: src.algorithms.qrc.QRCConfig
  name: qrc
  num_envs: 1
  gamma: 0.99
  trace_lambda: 0.8
  gradient_correction: true
  regularization_coefficient: 1.0
  track: false
  staleness_interval: 1
  taylor_trace: false

q_lr: 1e-4
h_lr: 1e-5

epsilon_start: 1.0
epsilon_end: 0.01
epsilon_fraction: 0.1

total_timesteps: 1_000_000
num_epochs: 50
